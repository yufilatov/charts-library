<div class="chart-title">
    <div>
        ENGLISH PREMIER LEAGUE 2018/2019 GAMES STATISTICS
    </div>
    <div></div>
    WON
    <div></div>
    DRAWN
    <div></div>
    LOST
</div>

<div class="chart-container">
    @for (chart of data; track chart; let i = $index) {
    <div class="item">
        <div class="title">{{chart.club}}</div>
        <app-chart>
            <app-chart-series
                type="donut"
                [data]="[chart.won, chart.drawn, chart.lost]"
                [style]="style"
            ></app-chart-series>
        </app-chart>
        <div class="title stats">
            <strong>W:</strong>
            {{chart.won}}
            <strong>D: </strong>
            {{chart.drawn}}
            <strong>L: </strong>
            {{chart.lost}}
        </div>
    </div>
    }
</div>
