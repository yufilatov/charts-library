@if (openMenu) {
    <button type="button" class="select-backdrop" aria-label="Close menu" (click)="openMenu = null"></button>
}

<div class="toolbar">
    <div class="field">
        <span class="field-label">Sort by</span>
        <div class="select sort" [class.open]="openMenu === 'sort'">
            <button type="button" class="select-trigger" aria-haspopup="listbox"
                [attr.aria-expanded]="openMenu === 'sort'" (click)="toggleMenu('sort')">
                <span>{{ selectedSortBy }}</span>
                <span class="chevron" aria-hidden="true"></span>
            </button>
            @if (openMenu === 'sort') {
                <ul class="select-menu" role="listbox">
                    @for (sort of sorts; track sort) {
                        <li>
                            <button type="button" role="option" [class.active]="sort === selectedSortBy"
                                [attr.aria-selected]="sort === selectedSortBy" (click)="chooseSort(sort)">
                                {{ sort }}
                            </button>
                        </li>
                    }
                </ul>
            }
        </div>
    </div>

    <div class="field">
        <span class="field-label">Goals</span>
        <div class="toggles" role="radiogroup" aria-label="Goals">
            <label class="toggle">
                <input type="radio" name="bar-goals" value="for" [checked]="goalsMode === 'for'"
                    (change)="selectGoals('for')">
                <span>Scored</span>
            </label>
            <label class="toggle">
                <input type="radio" name="bar-goals" value="against" [checked]="goalsMode === 'against'"
                    (change)="selectGoals('against')">
                <span>Conceded</span>
            </label>
        </div>
    </div>
</div>

<div class="container">
    <app-chart>
        <app-chart-series
            type="bar"
            orientation="vertical"
            [data]="data$ | async"
            [style]="style"
            [range]="range"
        ></app-chart-series>
        <app-chart-series
            type="grid"
            [step]="gridStep"
            [style]="gridStyle"
            [range]="range"
        ></app-chart-series>
        <app-chart-x-axis
            [range]="range.x"
            [ticks]="ticksX"
        ></app-chart-x-axis>
        <app-chart-y-axis
            [range]="range.y"
            [ticks]="ticksY"
        ></app-chart-y-axis>
        <app-chart-plot [margin]="margin"></app-chart-plot>
    </app-chart>

    <div class="logos">
        <div class="logo-plot">
            @for (club of clubs$ | async; track club.club; let i = $index) {
                <div class="logo" [ngClass]="getLogo(club.club)" [style.left]="'calc((' + (i + 1) + ' / 21) * 100% - 12.5px)'"></div>
            }
        </div>
    </div>
</div>
