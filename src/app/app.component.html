<header class="header">
    <a class="logo">
        <span class="logo-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="22" height="22">
                <rect x="3" y="16" width="6" height="12" rx="1.5" fill="currentColor" opacity="0.5" />
                <rect x="13" y="9" width="6" height="19" rx="1.5" fill="currentColor" opacity="0.78" />
                <rect x="23" y="4" width="6" height="24" rx="1.5" fill="currentColor" />
            </svg>
        </span>
        <span class="logo-copy">
            <span class="logo-title">D3-Chart-Library</span>
            <span class="logo-kicker">Interactive examples</span>
        </span>
    </a>
    <nav class="header-nav" aria-label="Pages">
        @for (page of pages; track page) {
            <a [routerLink]="page" routerLinkActive="active">{{ page }}</a>
        }
    </nav>
</header>

<div class="season-bar">
    <app-season-select></app-season-select>
</div>

<div class="main">
    <app-menu></app-menu>
    <div class="view">
        <router-outlet></router-outlet>
    </div>
</div>
